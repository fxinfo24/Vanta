name: CI

# Runs the two checks that have caught real defects in this repo: the pytest
# suite (which collects app/core/**/test_*.py as well as tests/) and the
# frontend typecheck, lint and production build. It installs the same
# requirements.txt Render installs, so a missing runtime dependency fails here
# instead of at deploy time - pydantic was exactly that, undeclared and needed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI has no .env. BYOK settings storage raises without a key, and the
      # suite must never read a real one.
      SECRET_KEY: ci-test-secret-not-used-in-production
      FLASK_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: frontend (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
